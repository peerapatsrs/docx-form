services:
  - type: web
    name: docx-form
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Optional: override writable data dir (defaults to OS temp /docx-form in production)
      - key: DOCX_FORM_DATA_DIR
        value: /tmp/docx-form
      # PORT is injected by Render — do not hardcode
